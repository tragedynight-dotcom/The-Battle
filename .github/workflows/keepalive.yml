# Streamlit Community Cloud는 한동안 접속이 없으면 잠긴다.
# curl만으로는 안 깨어나므로, 6시간마다 브라우저로 한 번 연다.
#
# GitHub 저장소 Settings → Secrets → Actions 에
# STREAMLIT_URL = https://(앱이름).streamlit.app  을 넣으십시오.
name: Streamlit 깨우기

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 배포 주소 열기
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: python tools/keepalive.py
